<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: gray;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        video{
            width: 100%;
            display: block;
        }
        .custom-controls {
            position: absolute;
            bottom: 0;
            left:0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
           padding: 12px;
           display: flex;
           flex-direction:column;
           gap: 8px;
           transition: opacity 0.3s ease;
        }
        .timeline-container {
            display:flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-runnable-track {
           -webkit-appearance: none;
           appearance: none;
           width:14px;
           height: 5px;
            border-radius: 50%;
            background-color: #38bd38;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }
        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .speed-badge {
            background-color: #0284c7;
            color:white;
        }       
    </style>
</head>
<body>
    <h2 style="margin-bottom: 16px;">Html5 Video Player</h2>
    <div class="player-container" id="videoBox">
    <video id="myVideo" playsinline webkit-playsinline preload="metadata" >
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>
    <div class="custom-controls">
<!---ilerleme çubuğu ve süre-->
<div class="timeline-container">
    <span id="currentTime">00:00</span>
    <input type="range" id="progressBar"
    class="progress-bar" min="0" max="100" value="0">
    <span id="durationTime">00:00</span>
</div>
<div class="button-group">
    <div class="left-controls">
        <button id="btnPlay">Oynat</button>
        <button id="btnMute">Sesli</button>
    </div>
    <div class="right-controls">
        <button id="btnSpeed" class="speed-badge">1.0x</button>
        <button id="btnPip">Pip</button>
        <button id="btnFull">Tam Ekran</button>
    </div>

</div>

<script>
    const video = document.getElementById('myVideo');
    const btnPlay = document.getElementById('btnPlay');
    const btnMute = document.getElementById('btnMute');
    const btnSpeed = document.getElementById('btnSpeed');
    const btnPip = document.getElementById('btnPip');
    const btnFull = document.getElementById('btnFull');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');

    btnPlay.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            btnPlay.innerText = 'Duraklat';
        } else {
            video.pause();
            btnPlay.innerText = 'Oynat';
        }
    });

    btnMute.addEventListener('click', () => {
        video.muted = !video.muted;
        btnMute.innerText = video.muted ? 'Sessiz' : 'Sesli';
    });

    btnSpeed.addEventListener('click', () => {
        const speeds = [1, 1.25, 1.5, 2];
        const nextSpeed = speeds[(speeds.indexOf(video.playbackRate) + 1) % speeds.length];
        video.playbackRate = nextSpeed;
        btnSpeed.innerText = `${nextSpeed}x`;
    });

    btnPip.addEventListener('click', async () => {
        if (document.pictureInPictureEnabled) {
            await video.requestPictureInPicture();
        }
    });

    btnFull.addEventListener('click', () => {
        const player = document.getElementById('videoBox');
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            player.requestFullscreen();
        }
    });

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    video.addEventListener('loadedmetadata', () => {
        durationTimeEl.innerText = formatTime(video.duration);
    });

    video.addEventListener('timeupdate', () => {
        currentTimeEl.innerText = formatTime(video.currentTime);
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.value = Number.isNaN(progress) ? 0 : progress;
    });

    progressBar.addEventListener('input', (e) => {
        const seekTime = (e.target.value / 100)*video.duration
        video.currentTime = seekTime;
    });
   
</script>
</body>
</html>
