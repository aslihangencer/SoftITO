<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        body {
        font-family: 'Coruier New', 'Courier New', Courier, monospace;
        background-color: khaki;
        margin: auto;
        padding: 20px;
        max-width: 600px
    }

    .card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
        h3{
            margin-top: 0;
            color: #1e293b;
}
    iframe {
       width: 100%;
       border-radius: 8px;
       border: none;
    }
    </style>
    </head>
    <body>
        <div class="card">
     <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/uh_lno-hOGk?si=77w2g_PJr-3NHC4R"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

</body>
