<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUTU & MODEL</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: 'Franklin Gothic Medium','Arial Narrow', sans-serif;
            background: #e2e8f0;
            padding: 20px;
        }
        .chat-row{
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        align-items: flex-end;
        }
        .avatar{
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .message-content{
            background: white;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 16px;
            max-width: 75%;
            box-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }
        .chat-row.outgoing{
            flex-direction: row-reverse;
        }
        .chat-row.outgoing .message-content{
            background-color: #6366f1;
            color: white;
            border-radius: 16px 16px 16px 16px;
        }
        .tx-avatar2{
            background: #10b981;
        }
    </style>
</head>
<body>
    <div class="chat-row">
    <div class="avatar">SÇ</div>

    <div class="message-content">
        <strong>Selahaddin Hoca:</strong>
        <p>Arkadaşlar flexbox mantığını kavradık mı? Bence Shad anlamadı.</p>
    </div>
</div>

<div class="chat-row outgoing">
    <div class="avatar2">SM</div>

    <div class="message-content">
        <p>Hocam ben anladım.</p>
    </div>
</div>
</body>
</html>
