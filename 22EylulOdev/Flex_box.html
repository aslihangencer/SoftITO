<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Container Laboratuarı</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .chip {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            color: #334115;
        }

        .card-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .card-display{
             display: flex;
             justify-content: space-between;
             align-items: center;
             background: white;
             padding: 16px 20px;
             border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            
        }
        .profile-title {
            font-size: 16px;
       }

       .login-time {
          color: #64748b;
          font-size: 13px;
       }
        .click-button{
            background: #4f46e5; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div>

        <h2>Mobil filtre (flex-wrap + gap)</h2>

        <div class="chip-container">
            <div class="chip">Akıllı Telefon</div>
            <div class="chip">Bilgisayar</div>
            <div class="chip">Kulaklık</div>
            <div class="chip">Akıllı saat</div>
            <div class="chip">Oyun konsolu</div>
            <div class="chip">Aksesuar</div>
        </div>

        <h2>Navigasyon barı (space-between + align-items)</h2>

        <div class="card-display">

            <div>
                <h3 style="font-size: 16px;">Kullanıcı profili</h3>
                <p>Giriş: 12:44 A.M</p>
            </div>

            <button class="click-button">Tıkla</button>
        </div>
    </div>

</body>

</html>
