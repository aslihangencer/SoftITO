<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klavye Değişkenleri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8fafc;
            color: #0f172a;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 6px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }
        .hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h3>Mobil Sanal Klavye Girişleri</h3>
    <form id="mobileForm" autocomplete="on">
        <div class="form-group">
            <label for="txtName">Ad Soyad(Otomatik Büyük Harf)</label>
            <input type="text" id="txtName" name="full_name" placeholder="Selahaddin ÇİFTÇİ" autocomplete="name"
            autocapitalize="words" enterkeyhint="next">
            <div class="hint">autocapitalize="words" her kelimenin ilk harfi büyük olur.</div>
        </div>
        <div class="form-group">
            <label for="txtEmail">E-Posta Adresi(düzeltme kapalı)</label>
            <input type="email" id="txtEmail" name="email" placeholder="selahaddin@kodvance.com" autocomplete="email"
            autocapitalize="none" enterkeyhint="next">
            <div class="hint">@ ve .com tuşları eklenir.</div>
        </div>
        <div class="form-group">
            <label for="txtCard">Kredi Kartı Numarası</label>
            <input type="text" id="txtCard" name="card_number" placeholder="1234 5678 9012 3456" autocomplete="cc-number" inputmode="numeric"  maxlength="19" enterkeyhint="next">
            <div class="hint">inputmode="numeric" sayısal tuş takımı açar ok tuşları çıkmaz </div>
        </div>
        <div class="form-group">
            <label for="txtAmount">Para transferi tutarı</label>
            <input type="text" id="txtAmount" name="amount" placeholder="1.250,50" inputmode="decimal" enterkeyhint="next">
            <div class="hint">Mobilde virgüllü noktalı ondalık sayı klavyesini açar </div>
        </div>
        <div class="form-group">
            <label for="txt0tp">Sms Doğrulama Kodu</label>
            <input type="tel" id="txt0tp" name="otp" placeholder="123456" autocomplete="one-time-code" inputmode="numeric" maxlength="6" enterkeyhint="done">
            <div class="hint">SMS geldiğinde klavyede kodu doldur önerisi çıkarır </div>
        </div>
    </form>

</body>
</html>
