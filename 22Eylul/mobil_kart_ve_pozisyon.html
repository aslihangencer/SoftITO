<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Pozisyonlama Mimarisi</title>
    <style>
        *,*::before,*::after{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #0f172a;
            color: white;
            padding-bottom: 80px;
        }
        /* Sticky mobil başlık */
        .mobile-header{
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            font-weight: 700;
        }

        .feed{
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-card{
            position: relative;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            padding: 20px;
        }

        .badge-discount{
            display: inline-block;
            margin-bottom: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            background: #ef4444;
            font-size: 12px;
            font-weight: 700;
        }

        .fab-btn{
            position: fixed;
            right: 20px;
            bottom: 80px;
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #06b6d4;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .bottom-nav{
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        .badge-discount{
            position: absolute;
            top: 14px;
            right: 14px;
            background: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5)
        }
        .bottom-nav{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items:center;
            z-index: 200;

        }
        .fab-btn{
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #06b6d4;
            color: white;
            font-size: 24px;
            border: none;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
            cursor: pointer;
            z-index: 150;
        }
    </style>
</head>
<body>
    <header class="mobile-header">Keşfet & Alışveriş</header>

    <main class="feed">
        <div class="product-card">
            <span class="badge-discount">%40 indirim</span>
            <h3>Kablosuz kulaklık</h3>
            <p style="color: #94a3b8; margin: 8px 0 16px;">AKTİF GÜRÜLTÜ ÖNLEYİCİ & 100 Saat pil ömrü</p>
            <strong style="color:aqua; font-size: 20px;">15000tl</strong>
        </div>
            <div class="product-card">
            <span class="badge-discount" style="background: #10b981;">yeni</span>
             <h3>Akıllı saat</h3>
             <p style="color: #94a3b8; margin: 8px 0 16px;"> 100 Saat pil ömrü</p>
            <strong style="color:aqua; font-size: 20px;">10000tl</strong>
            </div>

            <button class="fab-btn">+</button>
            <nav class="bottom-nav">
                <span>Anasayfa</span>
                 <span>ARAMA</span>
                  <span>Sepetim</span>
                  
            </nav>
    </main>
    </main>
</html>
