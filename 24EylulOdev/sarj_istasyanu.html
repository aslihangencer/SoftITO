<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARJ</title>
</head>
<script>

const sarjSuresiHesapla = (
  mevcutYuzde,
  hedefYuzde,
  bataryaKwh,
  istasyonKw,
  aracMaksSarjKw
) => {
  if (mevcutYuzde >= hedefYuzde) {
    console.log("Şarja gerek yok, devam edebilirsiniz.");
    return;
  }

  const gerekliEnerji = bataryaKwh * (hedefYuzde - mevcutYuzde) / 100;

  const kullanilacakGuc = Math.min(istasyonKw, aracMaksSarjKw);
  const sureSaat = gerekliEnerji / kullanilacakGuc;
  const sureDakika = sureSaat * 60;

  console.log("Tahmini şarj süresi:", sureDakika, "dakika");
};

sarjSuresiHesapla(10, 90, 40, 50, 25);

//FİYATLANDIRMA
const fiyat = {
  acNormal: 10,
  dcHizli: 15,
  kullanimUcreti: 5,
  bataryaKwh: 40
};

const sarjTuru = "ac";
const sarjZamani = "gunduz";
let sarjUcreti;

if (sarjTuru === "ac") {
  sarjUcreti = (fiyat.bataryaKwh * fiyat.acNormal) + fiyat.kullanimUcreti;
  console.log("AC şarj ücreti: " + sarjUcreti + " ₺");

} else if (sarjTuru === "dc") {
  sarjUcreti = (fiyat.bataryaKwh * fiyat.dcHizli) + fiyat.kullanimUcreti;
  console.log("DC hızlı şarj ücreti: " + sarjUcreti + " ₺");

} else {
  console.log("Şarj türü ac veya dc olmalıdır.");
}
// gunduz-gece
if (sarjZamani === "gunduz") {
  sarjUcreti = sarjUcreti * 1.05;
  console.log("Gündüz şarj ücreti: " + sarjUcreti + " ₺");
}

if (sarjZamani === "gece") {
  sarjUcreti = sarjUcreti * 0.95;
  console.log("Gece şarj ücreti: " + sarjUcreti + " ₺");
}
</script>
<body>
    
</body>
</html>
